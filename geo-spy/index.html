<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="Kevin_G">
<meta name="description" content="Geo.Spy, un juego de Kevin_G: aprende los países del mundo y los estados de EE. UU. por su forma y su bandera. Learn every country by its shape and flag.">
<!-- Geo.Spy - idea original y concepto: Kevin_G, 2026 -->
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Geo.Spy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://flagcdn.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Mismo layout y tema que Pie.Spy: cabecera con logo; un cuadro grande (mapa / estudiar) y cuadros pequeños a la derecha. */
:root{
  color-scheme:dark;
  --deep:#0b0414; --deep2:#12061f; --glass:rgba(26,10,46,.62); --edge:rgba(200,132,255,.32);
  --ghost:#c884ff; --ghost-dim:#8a4fd6; --text:#ead9ff; --muted:#9a7cc0;
  --ok:#3ddc84; --bad:#ff2a4a; --on:#12061f;
  --f-display:"Chakra Petch","Trebuchet MS",sans-serif;
  --f-mono:"JetBrains Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 70% -10%,#2a0f4a 0%,var(--deep2) 45%,var(--deep) 100%) fixed;color:var(--text);font-family:var(--f-mono);font-size:14px;line-height:1.5}
#rain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ghost);outline-offset:2px}
p{margin:0}

.app{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr) auto;gap:16px;padding-inline:22px;padding-block:16px;min-height:100%;max-width:1600px;margin:0 auto}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;position:relative;z-index:20}
.logo{font-family:var(--f-display);font-weight:700;font-size:40px;letter-spacing:.06em;line-height:1;display:flex;align-items:center;margin:0;text-shadow:0 0 18px rgba(200,132,255,.55)}
.globe{width:.86em;height:.86em;margin-inline:.04em .06em;fill:none;stroke:var(--ghost);stroke-width:1.7;filter:drop-shadow(0 0 6px var(--ghost)) drop-shadow(0 0 1px #fff);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.logo .ld{color:var(--ghost)}
.tag{color:var(--muted);font-size:13px}
.sig{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.22em;color:var(--ghost);text-shadow:0 0 12px rgba(200,132,255,.6);margin:6px 0 4px 2px}
.sig::before{content:"// ";color:var(--muted)}
.hright{display:flex;align-items:center;gap:12px}
footer{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);border-top:1px solid var(--edge);padding-top:10px}
footer b{color:var(--ghost);font-family:var(--f-display);letter-spacing:.12em;text-shadow:0 0 10px rgba(200,132,255,.5)}
.lang{display:flex;border:1px solid var(--edge);border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;padding:5px 14px;font-size:12px;font-weight:700;color:var(--muted)}
.lang button.on{background:var(--ghost);color:var(--on)}

/* menú de tres rayas */
.menuwrap{position:relative}
@media (max-width:600px){.menuwrap{position:static}}
.burger{width:42px;height:38px;border-radius:10px;border:1px solid var(--edge);background:rgba(18,6,31,.6);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:0}
.burger i{display:block;width:20px;height:2px;border-radius:2px;background:var(--ghost);box-shadow:0 0 8px var(--ghost);transition:transform .2s,opacity .2s}
.burger:hover{box-shadow:0 0 16px rgba(200,132,255,.4)}
.burger[aria-expanded="true"] i:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger[aria-expanded="true"] i:nth-child(2){opacity:0}
.burger[aria-expanded="true"] i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.menu{position:absolute;right:0;top:calc(100% + 10px);width:min(320px,calc(100vw - 32px));padding:14px;border-radius:16px;border:1px solid var(--edge);background:rgba(18,6,31,.97);box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 30px rgba(200,132,255,.15);display:flex;flex-direction:column;gap:8px}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 10px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--text);text-decoration:none;font-size:13px}
.mi:hover{border-color:var(--edge);background:rgba(200,132,255,.08)}
.mi.on{border-color:var(--edge);background:rgba(200,132,255,.1);cursor:default}
.mi .ico{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:rgba(200,132,255,.14);color:var(--ghost);font-size:18px;font-weight:700}
.mi .ico.pi{font-family:Georgia,serif;font-style:italic;font-size:22px}
.mi .ico .globe{width:22px;height:22px;margin:0;animation:none}
.mi .ico.hq{font-family:var(--f-display);font-size:13px}
.mi .ico .mo{display:flex;gap:2px;align-items:center}.mi .ico .mo i{display:block;width:4px;height:4px;border-radius:2px;background:var(--ghost)}.mi .ico .mo i.d{width:10px}
.mi b{display:block;font-family:var(--f-display);letter-spacing:.05em}
.mi small{display:block;color:var(--muted);font-size:11px}
.mi.danger{color:#ff9aab}
.mi.danger .ico{background:rgba(255,42,74,.15);color:#ff9aab}
.menu hr{border:0;border-top:1px solid var(--edge);margin:4px 0;width:100%}

.box{background:var(--glass);border:1px solid var(--edge);border-radius:18px;backdrop-filter:blur(3px);box-shadow:inset 0 0 30px rgba(200,132,255,.08),0 10px 40px rgba(0,0,0,.45);min-width:0}
.main{padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.side .box{padding:18px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tabs,.seg{display:flex;gap:6px}
.tabs button{background:transparent;border:1px solid var(--edge);border-radius:10px;padding:7px 16px;font-family:var(--f-display);font-weight:600;letter-spacing:.05em;color:var(--muted)}
.tabs button.on{background:linear-gradient(180deg,var(--ghost),var(--ghost-dim));color:var(--on);border-color:transparent;box-shadow:0 0 18px rgba(200,132,255,.45)}
.seg{border:1px solid var(--edge);border-radius:999px;padding:3px;gap:2px}
.seg button{background:transparent;border:0;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button.on{background:rgba(200,132,255,.22);color:var(--text);box-shadow:inset 0 0 0 1px var(--ghost)}
.count{font-family:var(--f-display);font-size:20px;font-weight:600;text-align:right;line-height:1.1}
.count b{color:var(--ghost);font-size:28px}
.count small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
#view{display:flex;flex-direction:column;gap:14px;flex:1}

/* mapa */
.mapbox{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--edge);background:radial-gradient(ellipse at 50% 40%,rgba(60,24,104,.55),rgba(11,4,20,.85))}
.map{display:block;width:100%;height:auto;max-height:58vh;cursor:grab;touch-action:none}
.map:active{cursor:grabbing}
.maploading{display:grid;place-items:center;min-height:300px;color:var(--muted)}
.maploading.err{color:#ff9aab}
.sphere{fill:rgba(18,6,31,.55);stroke:rgba(200,132,255,.4);stroke-width:1;vector-effect:non-scaling-stroke}
.grat{fill:none;stroke:rgba(200,132,255,.08);stroke-width:.6;vector-effect:non-scaling-stroke}
.land{fill:#24113d;stroke:rgba(200,132,255,.32);stroke-width:.5;vector-effect:non-scaling-stroke;transition:fill .4s,opacity .4s}
.land.known{fill:#4b2486}
.land.fresh{fill:#3a1d63;stroke:var(--ghost);stroke-dasharray:3 2}
.land.ok{fill:#1e8a55}
.land.bad{fill:#9d1f39}
.land.out,.map.playing .land.out{opacity:.32}
.zones{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.zones .eyebrow{margin-right:4px}
.zones button{background:transparent;border:1px solid var(--edge);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--muted)}
.zones button small{font-weight:400;opacity:.75;margin-left:2px}
.zones button.on{background:var(--ghost);color:var(--on);border-color:transparent;box-shadow:0 0 14px rgba(200,132,255,.4)}
.zones button:disabled{opacity:.4;cursor:not-allowed}
.map.playing .land{opacity:.72}
.map.playing .land.target{opacity:1;stroke:#fff;stroke-width:1.8;filter:url(#glow)}
.dotc{stroke-width:1}
.ring{fill:none;stroke:var(--ghost);stroke-width:2.5;vector-effect:non-scaling-stroke;filter:url(#glow);animation:ringp 1.2s ease-in-out infinite}
@keyframes ringp{50%{stroke-opacity:.35}}
.inset{position:absolute;right:10px;bottom:10px;width:150px;padding:6px;border-radius:12px;border:1px solid var(--edge);background:rgba(18,6,31,.85)}
.zoomout{position:absolute;left:10px;bottom:10px;border:1px solid var(--edge);background:rgba(18,6,31,.8);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--muted)}

/* forma del país con la bandera adentro */
.shape{display:block;width:100%;height:auto;overflow:visible}
.shape .base{fill:#2a1446}
.shape .edge{stroke:#fff;stroke-opacity:.9;stroke-width:1.2;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(200,132,255,.75))}
.noshape .flag{display:block;width:100%;aspect-ratio:3/2;object-fit:contain}

/* barra para escribir */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.streak{font-family:var(--f-display);font-weight:600;color:var(--muted)}
.streak b{color:var(--ghost);font-size:20px;text-shadow:0 0 12px rgba(200,132,255,.6)}
.streak.hot b{color:#ffb347;text-shadow:0 0 14px #ffb347}
.again{background:rgba(255,42,74,.18);color:#ff9aab;border:1px solid rgba(255,42,74,.5);border-radius:999px;padding:1px 9px;margin-left:8px;font-size:10px;letter-spacing:.1em}
.qbar{height:8px;background:rgba(200,132,255,.15);border-radius:4px;overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ghost-dim),var(--ghost));box-shadow:0 0 10px var(--ghost);transition:width .4s}
.guess{display:flex;gap:8px}
.guess input{flex:1;min-width:0;font:inherit;font-family:var(--f-display);font-size:20px;font-weight:600;color:var(--text);background:rgba(18,6,31,.75);border:1px solid var(--ghost);border-radius:12px;padding:10px 16px;box-shadow:0 0 18px rgba(200,132,255,.25)}
.guess input::placeholder{color:var(--muted);font-weight:500}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border:0;background:linear-gradient(180deg,var(--ghost),var(--ghost-dim));color:var(--on);padding:10px 18px;border-radius:10px;font-weight:700}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--edge)}
.btn.sm{padding:6px 14px;font-size:12px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.fb{min-height:24px;text-align:center;color:var(--muted)}
.fb.err{color:#ff9aab}
.fb.hint{font-family:var(--f-display);font-size:20px;letter-spacing:.12em;color:var(--ghost)}
.okcard,.reveal{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border-radius:14px}
.okcard{border:1px solid var(--ok);background:rgba(61,220,132,.1)}
.okcard h2{color:var(--ok)}
.reveal{border:1px solid var(--bad);background:rgba(255,42,74,.08)}
.okcard h2,.reveal h2{font-family:var(--f-display);font-size:28px;margin:2px 0 0;line-height:1.1}
.reveal h2{color:#fff}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}

/* quiz de opciones (Estudiar) */
.quiz{display:flex;flex-direction:column;gap:14px;max-width:820px;width:100%;margin:0 auto}
.stage{display:flex;flex-direction:column;align-items:center;gap:8px}
.stage .shapewrap{width:min(100%,380px)}
.ask{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:.03em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{position:relative;text-align:left;min-height:62px;padding:14px 16px 14px 54px;border-radius:14px;border:1px solid var(--c);background:linear-gradient(180deg,var(--bg),rgba(18,6,31,.6));font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.15;transition:transform .12s,box-shadow .12s,opacity .2s}
.opt .k{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:8px;background:var(--c);color:var(--on);display:grid;place-items:center;font-family:var(--f-mono);font-size:14px;font-weight:700}
.opts:not(.locked) .opt:hover{transform:translateY(-2px);box-shadow:0 0 22px var(--c)}
.o0{--c:#c884ff;--bg:rgba(200,132,255,.16)} .o1{--c:#4cc9f0;--bg:rgba(76,201,240,.16)} .o2{--c:#ff6ec7;--bg:rgba(255,110,199,.16)}
.o3{--c:#ffb347;--bg:rgba(255,179,71,.16)} .o4{--c:#7b8cff;--bg:rgba(123,140,255,.16)} .o5{--c:#e6dcff;--bg:rgba(230,220,255,.12)}
.opts.locked .opt{cursor:default}
.opts.locked .opt:not(.right):not(.wrong){opacity:.3}
.opt.right{background:var(--ok);border-color:var(--ok);color:var(--on);box-shadow:0 0 26px rgba(61,220,132,.45);animation:pop .3s}
.opt.right .k{background:var(--on);color:var(--ok)}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .25s 2}
.opt.wrong .k{background:#fff;color:var(--bad)}
@keyframes pop{50%{transform:scale(1.04)}}
.keys{text-align:center;font-size:11px;color:var(--muted);opacity:.7}
.subtabs{display:flex;gap:6px;justify-content:center}
.subtabs button{background:transparent;border:1px solid var(--edge);border-radius:999px;padding:5px 16px;font-size:12px;font-weight:700;color:var(--muted)}
.subtabs button.on{background:var(--ghost);color:var(--on);border-color:transparent}

.result{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 18px;border-radius:14px;border:1px solid var(--edge);background:rgba(18,6,31,.6)}
.result.win{border-color:var(--ok);box-shadow:0 0 24px rgba(61,220,132,.18)}
.result.lose{border-color:var(--bad)}
.result h2{font-family:var(--f-display);font-size:26px;margin:0;line-height:1.1}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.panel{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 18px;border-radius:14px;border:1px solid var(--edge);background:rgba(18,6,31,.6)}
.panel h2{font-family:var(--f-display);font-size:22px;margin:0;line-height:1.15}
.center{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.center p{max-width:62ch;color:var(--muted)}

/* tarjetas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%}
.grid.big{grid-template-columns:repeat(auto-fit,minmax(150px,190px));justify-content:center}
.card{position:relative;padding:12px 10px;border-radius:14px;border:1px solid var(--edge);background:rgba(18,6,31,.6);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
button.card:hover{border-color:var(--ghost)}
.card .fl{width:100%}
.card .nm{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.15;min-height:2.3em;display:grid;place-items:center}
.card .nm.hid{color:var(--muted);opacity:.5;font-size:22px}
.card .rg{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.card.new{border-color:var(--ghost);box-shadow:0 0 18px rgba(200,132,255,.28)}
.card .tagnew{position:absolute;top:-9px;right:10px;background:var(--ghost);color:var(--on);font-size:10px;font-weight:700;padding:1px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.08em;z-index:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chips button{background:transparent;border:1px solid var(--edge);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--muted)}
.chips button.on{background:var(--ghost);color:var(--on);border-color:transparent}
.miss{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.miss span{display:flex;align-items:center;gap:6px;border:1px solid var(--edge);border-radius:8px;padding:3px 8px 3px 4px;font-size:12px}
.miss img{width:26px;height:18px;object-fit:cover;border-radius:3px}

/* lateral */
.who{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.05;color:var(--ghost);text-shadow:0 0 16px rgba(200,132,255,.45);margin-top:4px}
.score{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.score b{font-family:var(--f-display);font-size:54px;line-height:.9}
.bar{height:8px;background:rgba(200,132,255,.15);border-radius:4px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ghost-dim),var(--ghost));box-shadow:0 0 10px var(--ghost);transition:width .6s}
.small{font-size:12px;color:var(--muted)}
.steps{margin:10px 0 0;padding-left:20px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.steps li::marker{color:var(--ghost);font-weight:700}
.lg{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;font-size:12.5px;margin-top:8px}
.lg i{width:26px;height:18px;border-radius:5px;display:block}
.hist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.hist li{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center}
.hist .dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
.hist .dot.w{background:var(--ok)}
.hist b{font-family:var(--f-display)}

@media (max-width:960px){.app{grid-template-columns:minmax(0,1fr);padding-inline:16px}.logo{font-size:30px}}
@media (max-width:560px){.opts{grid-template-columns:1fr}.opt{min-height:54px;font-size:16px}.main{padding:14px}.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.count{text-align:left}.inset{width:92px;right:6px;bottom:6px;padding:4px}.guess input{font-size:17px}}
@media (prefers-reduced-motion:reduce){.globe,.opt.right,.opt.wrong,.ring,.shake{animation:none}}
</style>

<canvas id="rain" aria-hidden="true"></canvas>
<div class="app">
  <header>
    <div>
      <h1 class="logo" aria-label="Geo.Spy">GE<svg class="globe" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="4.4" ry="10"/><path d="M2 12h20M3.6 7h16.8M3.6 17h16.8"/></svg><span class="ld">.</span>SPY</h1>
      <p class="sig">by Kevin_G</p>
      <p class="tag" id="tag"></p>
    </div>
    <div class="hright">
      <div class="lang" role="group" aria-label="Language"><button id="lES">ES</button><button id="lEN">EN</button></div>
      <div class="menuwrap">
        <button class="burger" id="burger" aria-expanded="false" aria-controls="menu"><i></i><i></i><i></i></button>
        <div class="menu" id="menu" hidden></div>
      </div>
    </div>
  </header>

  <main class="box main">
    <div class="top">
      <div class="tabs"><button id="tPlay"></button><button id="tStudy"></button></div>
      <div class="seg" id="sets"></div>
      <div class="count" id="count"></div>
    </div>
    <div class="zones" id="zones"></div>
    <div class="mapbox" id="mapBox"></div>
    <div id="view"></div>
  </main>

  <aside class="side">
    <div class="box" id="rankBox"></div>
    <div class="box" id="howBox"></div>
    <div class="box" id="histBox"></div>
  </aside>

  <footer><span id="foot"></span><span>© 2026 <b>Kevin_G</b></span></footer>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
</html>
