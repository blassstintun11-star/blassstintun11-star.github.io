<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="Kevin_G">
<meta name="description" content="Morse.Spy, un juego de Kevin_G: aprende a escuchar y mandar código Morse, una letra a la vez. Learn to hear and send Morse code, one letter at a time.">
<!-- Morse.Spy - idea original y concepto: Kevin_G, 2026 -->
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Morse.Spy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Mismo layout y tema que Pie.Spy y Geo.Spy: cabecera con logo; un cuadro grande y cuadros pequeños a la derecha. */
:root{
  color-scheme:dark;
  --deep:#0b0414; --deep2:#12061f; --glass:rgba(26,10,46,.62); --edge:rgba(200,132,255,.32);
  --ghost:#c884ff; --ghost-dim:#8a4fd6; --text:#ead9ff; --muted:#9a7cc0;
  --ok:#3ddc84; --bad:#ff2a4a; --on:#12061f;
  --f-display:"Chakra Petch","Trebuchet MS",sans-serif;
  --f-mono:"JetBrains Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 70% -10%,#2a0f4a 0%,var(--deep2) 45%,var(--deep) 100%) fixed;color:var(--text);font-family:var(--f-mono);font-size:14px;line-height:1.5}
#rain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ghost);outline-offset:2px}
p{margin:0}

.app{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr) auto;gap:16px;padding-inline:22px;padding-block:16px;min-height:100%;max-width:1600px;margin:0 auto}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;position:relative;z-index:20}
.logo{font-family:var(--f-display);font-weight:700;font-size:40px;letter-spacing:.06em;line-height:1;display:flex;align-items:center;margin:0;text-shadow:0 0 18px rgba(200,132,255,.55)}
/* la O es "− − −", que es la O en Morse */
.oo{display:inline-flex;gap:.07em;margin-inline:.06em .08em}
.oo i{display:block;width:.24em;height:.13em;border-radius:.07em;background:var(--ghost);box-shadow:0 0 10px var(--ghost),0 0 2px #fff;animation:oo 2.4s infinite}
.oo i:nth-child(2){animation-delay:.25s}.oo i:nth-child(3){animation-delay:.5s}
@keyframes oo{0%,100%{opacity:.45}10%,30%{opacity:1}}
.logo .ld{color:var(--ghost)}
.tag{color:var(--muted);font-size:13px}
.sig{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.22em;color:var(--ghost);text-shadow:0 0 12px rgba(200,132,255,.6);margin:6px 0 4px 2px}
.sig::before{content:"// ";color:var(--muted)}
.hright{display:flex;align-items:center;gap:12px}
footer{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);border-top:1px solid var(--edge);padding-top:10px}
footer b{color:var(--ghost);font-family:var(--f-display);letter-spacing:.12em;text-shadow:0 0 10px rgba(200,132,255,.5)}
.lang{display:flex;border:1px solid var(--edge);border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;padding:5px 14px;font-size:12px;font-weight:700;color:var(--muted)}
.lang button.on{background:var(--ghost);color:var(--on)}

/* menú de tres rayas */
.menuwrap{position:relative}
@media (max-width:600px){.menuwrap{position:static}}
.burger{width:42px;height:38px;border-radius:10px;border:1px solid var(--edge);background:rgba(18,6,31,.6);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:0}
.burger i{display:block;width:20px;height:2px;border-radius:2px;background:var(--ghost);box-shadow:0 0 8px var(--ghost);transition:transform .2s,opacity .2s}
.burger:hover{box-shadow:0 0 16px rgba(200,132,255,.4)}
.burger[aria-expanded="true"] i:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger[aria-expanded="true"] i:nth-child(2){opacity:0}
.burger[aria-expanded="true"] i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.menu{position:absolute;right:0;top:calc(100% + 10px);width:min(320px,calc(100vw - 32px));padding:14px;border-radius:16px;border:1px solid var(--edge);background:rgba(18,6,31,.97);box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 30px rgba(200,132,255,.15);display:flex;flex-direction:column;gap:8px}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 10px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--text);text-decoration:none;font-size:13px}
.mi:hover{border-color:var(--edge);background:rgba(200,132,255,.08)}
.mi.on{border-color:var(--edge);background:rgba(200,132,255,.1);cursor:default}
.mi .ico{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:rgba(200,132,255,.14);color:var(--ghost);font-size:18px;font-weight:700}
.mi .ico.pi{font-family:Georgia,serif;font-style:italic;font-size:22px}
.mi .ico.hq{font-family:var(--f-display);font-size:13px}
.mi .ico svg{width:22px;height:22px;fill:none;stroke:var(--ghost);stroke-width:1.7}
.mi .ico .mo{display:flex;gap:2px;align-items:center}.mi .ico .mo i{display:block;width:4px;height:4px;border-radius:2px;background:var(--ghost)}.mi .ico .mo i.d{width:10px}
.mi b{display:block;font-family:var(--f-display);letter-spacing:.05em}
.mi small{display:block;color:var(--muted);font-size:11px}
.mi.danger{color:#ff9aab}
.mi.danger .ico{background:rgba(255,42,74,.15);color:#ff9aab}
.menu hr{border:0;border-top:1px solid var(--edge);margin:4px 0;width:100%}

.box{background:var(--glass);border:1px solid var(--edge);border-radius:18px;backdrop-filter:blur(3px);box-shadow:inset 0 0 30px rgba(200,132,255,.08),0 10px 40px rgba(0,0,0,.45);min-width:0}
.main{padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.side .box{padding:18px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid var(--edge);border-radius:10px;padding:7px 16px;font-family:var(--f-display);font-weight:600;letter-spacing:.05em;color:var(--muted)}
.tabs button.on{background:linear-gradient(180deg,var(--ghost),var(--ghost-dim));color:var(--on);border-color:transparent;box-shadow:0 0 18px rgba(200,132,255,.45)}
.count{font-family:var(--f-display);font-size:20px;font-weight:600;text-align:right;line-height:1.1}
.count b{color:var(--ghost);font-size:28px}
#view{display:flex;flex-direction:column;gap:16px;flex:1}
.subtabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.subtabs button{background:transparent;border:1px solid var(--edge);border-radius:999px;padding:5px 16px;font-size:12px;font-weight:700;color:var(--muted)}
.subtabs button.on{background:var(--ghost);color:var(--on);border-color:transparent}
.subtabs button:disabled{opacity:.4;cursor:not-allowed}

/* curso */
.course{display:flex;flex-direction:column;gap:8px}
.course .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.course h2{margin:0;font-family:var(--f-display);font-size:24px}
.bar{height:8px;background:rgba(200,132,255,.15);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ghost-dim),var(--ghost));box-shadow:0 0 10px var(--ghost);transition:width .5s}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{font-family:var(--f-display);font-weight:700;min-width:28px;text-align:center;border:1px solid var(--edge);border-radius:8px;padding:1px 7px;color:var(--muted)}
.chips span.new{border-color:var(--ghost);color:var(--text);box-shadow:0 0 10px rgba(200,132,255,.35)}

/* la letra con sus puntos y rayas */
.letters{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.lcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 26px;min-width:220px;border-radius:18px;border:1px solid var(--ghost);background:rgba(18,6,31,.6);box-shadow:0 0 26px rgba(200,132,255,.22)}
.lcard .tagnew{position:absolute;top:-10px;right:14px;background:var(--ghost);color:var(--on);font-size:10px;font-weight:700;padding:1px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.08em}
.big{font-family:var(--f-display);font-weight:700;font-size:92px;line-height:1;color:var(--text);text-shadow:0 0 24px rgba(200,132,255,.6)}
.pat{display:flex;gap:10px;align-items:center;min-height:18px}
.pat i{display:block;height:16px;width:16px;border-radius:8px;background:var(--ghost);opacity:.35;box-shadow:0 0 0 rgba(200,132,255,0);transition:opacity .06s,box-shadow .06s}
.pat i.d{width:48px}
.pat i.lit{opacity:1;box-shadow:0 0 16px var(--ghost),0 0 3px #fff}
.pat.sm{gap:6px}.pat.sm i{height:9px;width:9px}.pat.sm i.d{width:26px}
.pat.ok i{background:var(--ok);opacity:1}
.pat.lit-all i{opacity:1;box-shadow:0 0 12px var(--ghost)}
.pat.bad i{background:var(--bad);opacity:1}

/* rondas */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.streak{font-family:var(--f-display);font-weight:600;color:var(--muted)}
.streak b{color:var(--ghost);font-size:20px;text-shadow:0 0 12px rgba(200,132,255,.6)}
.streak.hot b{color:#ffb347;text-shadow:0 0 14px #ffb347}
.again{background:rgba(255,42,74,.18);color:#ff9aab;border:1px solid rgba(255,42,74,.5);border-radius:999px;padding:1px 9px;margin-left:8px;font-size:10px;letter-spacing:.1em}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.screen{width:min(100%,460px);min-height:170px;border-radius:18px;border:1px solid var(--edge);background:radial-gradient(ellipse at 50% 30%,rgba(60,24,104,.55),rgba(11,4,20,.85));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;box-shadow:inset 0 0 40px rgba(200,132,255,.1)}
.screen .big{font-size:84px}
.screen .big.q{color:var(--muted);opacity:.6}
.screen .big.ok{color:var(--ok);text-shadow:0 0 24px rgba(61,220,132,.6)}
.screen .big.bad{color:#fff}
.wave{display:flex;gap:4px;align-items:center;height:30px}
.wave i{display:block;width:4px;height:6px;border-radius:2px;background:var(--ghost);opacity:.4;transition:height .08s,opacity .08s}
.wave.on i{opacity:1;box-shadow:0 0 8px var(--ghost)}
.ask{font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--muted);text-align:center}
.btn{border:0;background:linear-gradient(180deg,var(--ghost),var(--ghost-dim));color:var(--on);padding:10px 18px;border-radius:10px;font-weight:700}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--edge)}
.btn.sm{padding:6px 14px;font-size:12px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;width:min(100%,640px);margin:0 auto}
.keys button{height:52px;border-radius:12px;border:1px solid var(--edge);background:rgba(18,6,31,.65);font-family:var(--f-display);font-weight:700;font-size:22px;transition:transform .08s,box-shadow .12s}
.keys button:hover{border-color:var(--ghost);box-shadow:0 0 14px rgba(200,132,255,.35)}
.keys button:active{transform:scale(.95)}
.guess{display:flex;gap:8px;width:min(100%,520px);margin:0 auto}
.guess input{flex:1;min-width:0;font:inherit;font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text);background:rgba(18,6,31,.75);border:1px solid var(--ghost);border-radius:12px;padding:10px 16px;box-shadow:0 0 18px rgba(200,132,255,.25)}
.guess input::placeholder{letter-spacing:.02em;text-transform:none;color:var(--muted);font-weight:500}
.hint{text-align:center;font-size:12px;color:var(--muted)}
.reveal{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border-radius:14px;border:1px solid var(--bad);background:rgba(255,42,74,.08);width:min(100%,640px);margin:0 auto}
.reveal h2{font-family:var(--f-display);font-size:30px;margin:2px 0 4px;line-height:1.1;color:#fff}
.fbok{color:var(--ok);font-family:var(--f-display);font-weight:700;font-size:18px;text-align:center;min-height:26px}

/* manipulador para mandar */
.keyer{width:min(100%,360px);height:110px;margin:0 auto;border-radius:20px;border:1px solid var(--ghost);background:linear-gradient(180deg,rgba(200,132,255,.18),rgba(18,6,31,.8));font-family:var(--f-display);font-weight:700;letter-spacing:.08em;color:var(--text);
  box-shadow:0 0 22px rgba(200,132,255,.25),inset 0 -6px 0 rgba(0,0,0,.35);user-select:none;-webkit-user-select:none;touch-action:none;transition:transform .05s,box-shadow .05s}
.keyer.down{transform:translateY(3px);box-shadow:0 0 34px var(--ghost),inset 0 -2px 0 rgba(0,0,0,.35);background:linear-gradient(180deg,rgba(200,132,255,.42),rgba(18,6,31,.8))}
.sent{min-height:30px}

.result{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 18px;border-radius:14px;border:1px solid var(--edge);background:rgba(18,6,31,.6)}
.result.win{border-color:var(--ok);box-shadow:0 0 24px rgba(61,220,132,.18)}
.result.lose{border-color:var(--bad)}
.result h2{font-family:var(--f-display);font-size:26px;margin:0;line-height:1.1}
.panel{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 18px;border-radius:14px;border:1px solid var(--edge);background:rgba(18,6,31,.6)}
.panel h2{font-family:var(--f-display);font-size:22px;margin:0;line-height:1.15}
.center{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.center p{max-width:62ch;color:var(--muted)}
.miss{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.miss span{display:flex;align-items:center;gap:8px;border:1px solid var(--edge);border-radius:8px;padding:3px 10px;font-family:var(--f-display);font-weight:700}

/* tabla */
.chart{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.cc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px;border-radius:14px;border:1px solid var(--edge);background:rgba(18,6,31,.6)}
button.cc:hover{border-color:var(--ghost);box-shadow:0 0 14px rgba(200,132,255,.3)}
.cc b{font-family:var(--f-display);font-size:30px;line-height:1}
.cc.lock{opacity:.4;border-style:dashed}
.cc small{font-size:10px;color:var(--muted)}

/* misión final */
.mission{border:1px solid var(--ghost);border-radius:16px;padding:18px;background:linear-gradient(120deg,rgba(200,132,255,.14),rgba(18,6,31,.7) 60%);display:flex;flex-direction:column;gap:10px}
.mission h2{margin:0;font-family:var(--f-display);font-size:22px}
.mission p{color:var(--muted)}
.mission .solved{color:var(--ok);font-family:var(--f-display);font-weight:700}

/* lateral */
.who{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.05;color:var(--ghost);text-shadow:0 0 16px rgba(200,132,255,.45);margin-top:4px}
.score{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.score b{font-family:var(--f-display);font-size:54px;line-height:.9}
.small{font-size:12px;color:var(--muted)}
.badge{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--on);background:var(--ok);border-radius:999px;padding:2px 10px}
.steps{margin:10px 0 0;padding-left:20px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.steps li::marker{color:var(--ghost);font-weight:700}
.cfg{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.cfg label{display:flex;flex-direction:column;gap:4px;font-size:12px}
.cfg label span{display:flex;justify-content:space-between;color:var(--muted)}
.cfg label span b{color:var(--text);font-family:var(--f-display)}
.cfg input[type=range]{width:100%;accent-color:var(--ghost)}
.hist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.hist li{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center}
.hist .dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
.hist .dot.w{background:var(--ok)}
.hist b{font-family:var(--f-display)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}

@media (max-width:960px){.app{grid-template-columns:minmax(0,1fr);padding-inline:16px}.logo{font-size:30px}}
@media (max-width:560px){.main{padding:14px}.big{font-size:72px}.screen .big{font-size:68px}.lcard{min-width:0;width:100%}.count{text-align:left}.keys{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}.keys button{height:46px}}
@media (prefers-reduced-motion:reduce){.oo i,.shake{animation:none}.oo i{opacity:1}}
</style>

<canvas id="rain" aria-hidden="true"></canvas>
<div class="app">
  <header>
    <div>
      <h1 class="logo" aria-label="Morse.Spy">M<span class="oo" aria-hidden="true"><i></i><i></i><i></i></span>RSE<span class="ld">.</span>SPY</h1>
      <p class="sig">by Kevin_G</p>
      <p class="tag" id="tag"></p>
    </div>
    <div class="hright">
      <div class="lang" role="group" aria-label="Language"><button id="lES">ES</button><button id="lEN">EN</button></div>
      <div class="menuwrap">
        <button class="burger" id="burger" aria-expanded="false" aria-controls="menu"><i></i><i></i><i></i></button>
        <div class="menu" id="menu" hidden></div>
      </div>
    </div>
  </header>

  <main class="box main">
    <div class="top">
      <div class="tabs"><button id="tLearn"></button><button id="tPractice"></button><button id="tChart"></button></div>
      <div class="count" id="count"></div>
    </div>
    <div id="view"></div>
  </main>

  <aside class="side">
    <div class="box" id="rankBox"></div>
    <div class="box" id="cfgBox"></div>
    <div class="box" id="howBox"></div>
    <div class="box" id="histBox"></div>
  </aside>

  <footer><span id="foot"></span><span>© 2026 <b>Kevin_G</b></span></footer>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script src="morse.js"></script>
</html>
